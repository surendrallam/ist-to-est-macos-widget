name: Release

# Push a tag like v1.2.3 (or run this workflow by hand with a version) to build the
# universal app, package IST-to-EST.dmg / IST-to-EST.zip / SHA256SUMS.txt and publish
# a GitHub release. Signing and notarization are used when the secrets are set:
#
#   MACOS_CERTIFICATE_P12_BASE64   base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD     password of that .p12
#   DEVELOPER_ID_APPLICATION       identity name, e.g. "Developer ID Application: Name (TEAMID)"
#                                  (optional: detected from the certificate when empty)
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD   notarization
#
# Without them the release is ad-hoc signed and the notes explain how to open it.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.0.1 (tag v1.0.1 is created on the selected branch if it does not exist)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Test TimeConversionKit
        run: swift test --package-path Packages/TimeConversionKit

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "::notice::No signing certificate configured; this release will be ad-hoc signed and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Tell the cleanup step about the keychain before anything else can fail.
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null

          # Put the keychain first in the search list, keeping the existing ones.
          keychains=("$keychain")
          while IFS= read -r line; do
            line="${line//\"/}"
            line="${line#"${line%%[![:space:]]*}"}"
            if [[ -n "$line" ]]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

          identity="$DEVELOPER_ID_APPLICATION"
          if [[ -z "$identity" ]]; then
            identity="$(security find-identity -v -p codesigning "$keychain" \
              | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          fi
          if [[ -z "$identity" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "DEVELOPER_ID_APPLICATION=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Build, sign and package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/build-release.sh

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          # The "## [x.y.z] - date" section of CHANGELOG.md, without the heading.
          if [[ -f CHANGELOG.md ]]; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && (/^## / || /^\[.*\]: /) { exit }
              found { print }
            ' CHANGELOG.md \
              | awk 'NF { if (started) for (; blanks > 0; blanks--) print ""; blanks = 0; started = 1; print; next } { blanks++ }' \
              > "$notes"
          fi
          if [[ ! -s "$notes" ]]; then
            {
              echo "IST to EST $VERSION — India Standard Time and US Eastern Time side by side in Notification Center."
              echo
              echo "See the [changelog]($REPO_URL/blob/main/CHANGELOG.md) for details."
            } > "$notes"
          fi
          {
            echo
            echo "## Install"
            echo
            echo "1. Download **IST-to-EST.dmg** below, open it and drag **IST to EST** into **Applications**."
            echo "2. Open **IST to EST** from Applications once. This registers the widget."
            echo "3. Click the date and time in the menu bar to open Notification Center, scroll down and click **Edit Widgets**, search for **IST to EST**, then drag a size into Notification Center or onto the desktop."
            echo
            echo "Requires macOS 14 Sonoma or later, on Apple silicon or Intel."
            if [[ "$NOTARIZED" != true ]]; then
              echo
              echo "> **First launch:** this build is not notarized by Apple, so macOS blocks it the first time (\"Apple could not verify…\")."
              echo "> Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**, then confirm. Or run this in Terminal:"
              echo ">"
              echo "> \`\`\`sh"
              echo "> xattr -dr com.apple.quarantine \"/Applications/IST to EST.app\""
              echo "> \`\`\`"
            fi
            echo
            echo "**Verify the download:** \`shasum -a 256 -c SHA256SUMS.txt\` (in the folder with the downloaded files)."
          } >> "$notes"
          cat "$notes"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(build/release/IST-to-EST.dmg build/release/IST-to-EST.zip build/release/SHA256SUMS.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets and notes."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "IST to EST $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "IST to EST $VERSION" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA"
          fi

      - name: Keep build output with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: build/release/
          if-no-files-found: ignore

      - name: Delete temporary keychain
        if: always()
        run: |
          if [[ -n "${CODESIGN_KEYCHAIN:-}" && -f "$CODESIGN_KEYCHAIN" ]]; then
            security delete-keychain "$CODESIGN_KEYCHAIN"
            echo "Deleted $CODESIGN_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
