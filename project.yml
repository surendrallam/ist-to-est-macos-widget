# XcodeGen spec — run `make project` (or `xcodegen generate`) to create ISTtoEST.xcodeproj.
name: ISTtoEST

options:
  bundleIdPrefix: io.github.surendrallam
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  # Pin the .xcodeproj format so a newer XcodeGen can't write a file Xcode 15.3 refuses to open
  # (XcodeGen 2.44.1+ defaults to the Xcode 16 format). `projectFormat` needs XcodeGen 2.45.0.
  projectFormat: xcode15_3
  minimumXcodeGenVersion: 2.45.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc ("Sign to Run Locally") by default so anyone can build without an Apple
    # developer account. Release builds are re-signed with a Developer ID in CI when
    # the signing secrets are configured (see scripts/build-release.sh).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TimeConversionKit:
    path: Packages/TimeConversionKit

targets:
  ISTtoEST:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: ISTtoESTWidget
      - package: TimeConversionKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: IST to EST
        CFBundleDisplayName: IST to EST
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 surendrallam. MIT License.
    entitlements:
      path: App/ISTtoEST.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: IST to EST
        PRODUCT_MODULE_NAME: ISTtoEST
        PRODUCT_BUNDLE_IDENTIFIER: io.github.surendrallam.ISTtoEST
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ISTtoESTWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: TimeConversionKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: IST to EST
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 surendrallam. MIT License.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ISTtoESTWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: ISTtoESTWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.github.surendrallam.ISTtoEST.Widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  ISTtoESTTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the shared views directly (no host app), so tests run unsandboxed
    # and can write snapshot PNGs anywhere.
    sources:
      - Tests/ISTtoESTTests
      - Shared
    dependencies:
      - package: TimeConversionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.surendrallam.ISTtoEST.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ISTtoEST:
    build:
      targets:
        ISTtoEST: all
        ISTtoESTTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ISTtoESTTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
